name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check every script
        run: |
          for f in assets/*.js data/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: Scenario bank is valid and every decision path plays
        run: node scripts/check_scenarios.js

      - name: Example reports are up to date
        run: |
          node scripts/build_examples.js
          git diff --exit-code -- examples/

      - name: Example reports have the expected shape
        run: |
          node - <<'EOF'
          const fs = require("fs");
          for (const f of ["northwind-ransomware-report", "northwind-bec-report"]) {
            const r = JSON.parse(fs.readFileSync(`examples/${f}.json`, "utf8"));
            if (r.schema !== "cyber-crisis-tabletop/1.0") throw new Error(f + ": schema");
            if (!(r.score.pct >= 0 && r.score.pct <= 100)) throw new Error(f + ": score");
            if (r.roles.length !== 3 || !r.log.length || r.hotwash.length < 3) throw new Error(f + ": shape");
            console.log("OK:", f, r.score.pct + "%", r.score.band.label);
          }
          EOF

      - name: HTML is valid (html-validate, recommended preset)
        run: npx --yes html-validate@8 index.html

      - name: No external resources or inline scripts (CSP stays meaningful)
        run: |
          ! grep -Ei '<(script|link)[^>]+(src|href)="(https?:)?//' index.html
          ! grep -Ei '<script>' index.html
          ! grep -Ei '@import|url\(https?:' assets/style.css
          ! grep -Ei 'innerHTML|insertAdjacentHTML|document\.write|eval\(' assets/*.js
          echo "OK: all resources are local and no HTML is built from strings"
